image:
  apt:
    install:
      - weston
  rootfs:
    mkdir:
      - /etc/xdg/weston
    copy:
      - ./weston/weston.ini:/etc/xdg/weston/weston.ini
      - ./weston/weston.service:/etc/systemd/system/weston.service
  services:
    enable:
      - weston.service
    disable:
      - pair-fb.service
  env:
    - XDG_RUNTIME_DIR: /run/user/1000
    - WESTON_DISPLAY: wayland-1
