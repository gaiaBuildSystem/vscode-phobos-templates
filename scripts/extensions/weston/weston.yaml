image:
  apt:
    install:
      - weston
      - xwayland
  rootfs:
    mkdir:
      - /etc/xdg/weston
    copy:
      # this is commented out, uncomment if kiosk mode required
      # - ./weston/weston-kiosk.ini:/etc/xdg/weston/weston.ini
      - ./weston/weston.ini:/etc/xdg/weston/weston.ini
      - ./weston/weston.service:/etc/systemd/system/weston.service
  services:
    enable:
      - weston.service
    disable:
      - pair-fb.service
  env:
    - XDG_RUNTIME_DIR: /run/weston
    - WAYLAND_DISPLAY: wayland-1
    - DISPLAY: :0
